databaseChangeLog:
  - changeSet:
      id: 1-create-employees
      author: alexander
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_employees
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: age
                  type: integer
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: position
                  type: varchar(255)
              - column:
                  name: department_id
                  type: bigint
              - column:
                  name: organization_id
                  type: bigint
              - column:
                  name: create_at
                  type: timestamp
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
        - addUniqueConstraint:
            tableName: employees
            columnNames: email
            constraintName: uk_employees_email

