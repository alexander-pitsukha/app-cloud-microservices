server:
  port: 8080

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} ${LOG_LEVEL_PATTERN:-%5p} %m%n"

gateway:
  security:
    open-api-endpoints:
      - /identity/auth/signup
      - /identity/auth/signin
      - /identity/auth/verify-email
      - /identity/auth/password-reset
      - /identity/auth/refresh-token

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/identity/**
              filters:
                - AuthenticationFilter
                - RewritePath=/identity/(?<path>.*), /$\{path}
                - name: CircuitBreaker
                  args:
                    name: identity-service-circuit-breaker
                    fallback-uri: forward:/identity-service-fallback
            - id: employee-service
              uri: lb://employee-service
              predicates:
                - Path=/employee/**
              filters:
                - AuthenticationFilter
                - RewritePath=/employee/(?<path>.*), /$\{path}
            - id: department-service
              uri: lb://department-service
              predicates:
                - Path=/department/**
              filters:
                - AuthenticationFilter
                - RewritePath=/department/(?<path>.*), /$\{path}
            - id: organization-service
              uri: lb://organization-service
              predicates:
                - Path=/organization/**
              filters:
                - AuthenticationFilter
                - RewritePath=/organization/(?<path>.*), /$\{path}
          httpclient:
            connect-timeout: 10000
            response-timeout: 60s

resilience4j:
  timelimiter:
    instances:
      identity-service-circuit-breaker:
        timeout-duration: 60s
  circuitbreaker:
    instances:
      identity-service-circuit-breaker:
        sliding-window-size: 10
        failure-rate-threshold: 50

springdoc:
  swagger-ui:
    urls:
      - name: gateway-service
        url: /v3/api-docs
      - name: identity-service
        url: /identity/v3/api-docs
      - name: employee-service
        url: /employee/v3/api-docs
      - name: department-service
        url: /department/v3/api-docs
      - name: organization-service
        url: /organization/v3/api-docs
    urls-primary-name: identity-service
