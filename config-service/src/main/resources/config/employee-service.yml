server:
  port: 8084

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} ${LOG_LEVEL_PATTERN:-%5p} %m%n"

spring:
  datasource:
    url: jdbc:sqlite:memory:myDb?date_class=TEXT
    driver-class-name: org.sqlite.JDBC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
        dialect: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: true

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
